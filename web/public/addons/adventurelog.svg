<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- AdventureLog: an open journal with a quill tracing your route, on the site icon's disc
       (Horde crimson top-left, Alliance navy bottom-right, waving gold seam, embers and frost).
       Every animation divides a 6 s loop so the GIF/WebP exports loop seamlessly; the SVG stays
       still under prefers-reduced-motion. Exports: web/scripts/render-addon-icons.mjs. -->
  <style>
    .wave { animation: wave 6s linear infinite; }
    .seam { animation: wave 6s linear infinite, seamPulse 3s ease-in-out infinite; }
    .glint { transform-box: view-box; transform-origin: 32px 32px; animation: spin 6s linear infinite; }
    .shine { animation: shine 6s ease-in-out infinite; }
    .ember { animation: ember 3s ease-out infinite; }
    .e2 { animation-delay: -1s; }
    .e3 { animation-delay: -0.4s; animation-duration: 2s; }
    .mote { animation: mote 6s ease-in-out infinite; }
    .m2 { animation-delay: -2s; animation-duration: 3s; }
    .m3 { animation-delay: -4s; }
    .forge { animation: forge 3s ease-in-out infinite; }
    .frost { animation: frost 6s ease-in-out infinite; }
    .quill { transform-box: view-box; transform-origin: 44.5px 31px; animation: write 1.5s ease-in-out infinite; }
    .reveal { animation: reveal 6s linear infinite; }
    .trail { animation: trailFade 6s linear infinite; }
    .rec { animation: rec 1.5s ease-in-out infinite; }
    @keyframes wave { to { transform: translateX(-16px); } }
    @keyframes seamPulse { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes shine { 0%, 55% { transform: translate(-40px, -40px); } 85%, 100% { transform: translate(40px, 40px); } }
    @keyframes ember { 0% { transform: translateY(0); opacity: 0; } 15% { opacity: 1; } 100% { transform: translateY(-14px); opacity: 0; } }
    @keyframes mote { 0%, 100% { transform: translate(0, 0); opacity: .25; } 50% { transform: translate(2px, -2px); opacity: .95; } }
    @keyframes forge { 0%, 100% { opacity: .7; } 40% { opacity: 1; } 55% { opacity: .82; } }
    @keyframes frost { 0%, 100% { opacity: .6; } 50% { opacity: 1; } }
    @keyframes write { 0%, 100% { transform: rotate(0deg); } 30% { transform: rotate(-5deg); } 60% { transform: rotate(2deg); } }
    @keyframes reveal { 0% { stroke-dashoffset: 1; } 65%, 100% { stroke-dashoffset: 0; } }
    @keyframes trailFade { 0%, 82% { opacity: 1; } 96%, 100% { opacity: 0; } }
    @keyframes rec { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .reveal { stroke-dashoffset: 0; }
    }
  </style>
  <defs>
    <linearGradient id="horde" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b8383a"/>
      <stop offset="1" stop-color="#5c1414"/>
    </linearGradient>
    <linearGradient id="alliance" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2056a6"/>
      <stop offset="1" stop-color="#0b1630"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd98a"/>
      <stop offset="0.3" stop-color="#c6a15a"/>
      <stop offset="0.7" stop-color="#9cb0c9"/>
      <stop offset="1" stop-color="#eef2f7"/>
    </linearGradient>
    <linearGradient id="cover" gradientUnits="userSpaceOnUse" x1="12" y1="20" x2="52" y2="50">
      <stop offset="0" stop-color="#e0b25c"/>
      <stop offset="0.5" stop-color="#9a7436"/>
      <stop offset="1" stop-color="#b9c7da"/>
    </linearGradient>
    <linearGradient id="page" gradientUnits="userSpaceOnUse" x1="15" y1="19" x2="49" y2="47">
      <stop offset="0" stop-color="#ffefc0"/>
      <stop offset="0.5" stop-color="#f6ead0"/>
      <stop offset="1" stop-color="#dfe9f8"/>
    </linearGradient>
    <linearGradient id="gutter" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5a3d18" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#5a3d18" stop-opacity=".45"/>
      <stop offset="1" stop-color="#5a3d18" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="feather" gradientUnits="userSpaceOnUse" x1="55" y1="10" x2="45" y2="30">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#ffe2a0"/>
      <stop offset="1" stop-color="#d79a3c"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0.35" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity=".85"/>
      <stop offset="0.65" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="forgeGlow" cx="0.3" cy="0.3" r="0.45">
      <stop offset="0" stop-color="#ff7a3c" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ff7a3c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="frostGlow" cx="0.72" cy="0.72" r="0.45">
      <stop offset="0" stop-color="#9cc3f5" stop-opacity=".5"/>
      <stop offset="1" stop-color="#9cc3f5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.45" r="0.55">
      <stop offset="0.6" stop-color="#040408" stop-opacity="0"/>
      <stop offset="1" stop-color="#040408" stop-opacity=".55"/>
    </radialGradient>
    <radialGradient id="spark">
      <stop offset="0" stop-color="#fff4c8"/>
      <stop offset="1" stop-color="#ff9a4a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="flake">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#9cc3f5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="recGlow">
      <stop offset="0" stop-color="#ff5a48" stop-opacity=".9"/>
      <stop offset="1" stop-color="#ff5a48" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="disc"><circle cx="32" cy="32" r="28"/></clipPath>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="1.1"/></filter>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.2" stdDeviation="1.2" flood-color="#000" flood-opacity=".6"/>
    </filter>
    <path id="edge" d="M-40 32q4-1.8 8 0t8 0t8 0t8 0t8 0t8 0t8 0t8 0t8 0t8 0t8 0t8 0t8 0t8 0t8 0t8 0t8 0t8 0t8 0t8 0t8 0t8 0"/>
    <!-- The journal: cover behind two curved pages. -->
    <path id="coverShape" d="M12.5 21.5V46.8C20 45.6 27 46.4 32 49.2C37 46.4 44 45.6 51.5 46.8V21.5C44 20 37 20.4 32 23.2C27 20.4 20 20 12.5 21.5Z"/>
    <path id="pages" d="M32 22.6C27 19.6 20.5 19 15 20.4V44.4C20.5 43.2 27 43.8 32 46.6C37 43.8 43.5 43.2 49 44.4V20.4C43.5 19 37 19.6 32 22.6Z"/>
    <!-- The route the quill has written, ending at its nib. -->
    <path id="trail" d="M35.8 41.2C37.6 37 41.6 39.4 41 35.2C40.5 32.2 43.2 32.4 44.5 31"/>
    <mask id="trailMask" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
      <use href="#trail" class="reveal" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" pathLength="1" stroke-dasharray="1 1"/>
    </mask>
    <mask id="bookMask"><use href="#coverShape" fill="#fff"/></mask>
  </defs>

  <circle cx="32" cy="32" r="31" fill="#0e0c12"/>
  <g clip-path="url(#disc)">
    <rect width="64" height="64" fill="url(#horde)"/>
    <g transform="rotate(-45 32 32)">
      <g class="wave" filter="url(#soft)">
        <path d="M-40 32q4-1.8 8 0t8 0t8 0t8 0t8 0t8 0t8 0t8 0t8 0t8 0t8 0t8 0t8 0t8 0t8 0t8 0t8 0t8 0t8 0t8 0t8 0t8 0V120H-40Z" fill="url(#alliance)"/>
      </g>
    </g>
    <circle class="forge" cx="32" cy="32" r="32" fill="url(#forgeGlow)"/>
    <circle class="frost" cx="32" cy="32" r="32" fill="url(#frostGlow)"/>
    <g transform="rotate(-45 32 32)">
      <g class="seam">
        <use href="#edge" fill="none" stroke="#ffcf6e" stroke-width="2.4" filter="url(#glow)"/>
        <use href="#edge" fill="none" stroke="#fff1c4" stroke-width=".6"/>
      </g>
    </g>
    <circle class="ember" cx="11" cy="40" r="1.7" fill="url(#spark)"/>
    <circle class="ember e2" cx="18" cy="17" r="1.3" fill="url(#spark)"/>
    <circle class="ember e3" cx="9" cy="30" r="1.2" fill="url(#spark)"/>
    <circle class="mote" cx="52" cy="40" r="1.6" fill="url(#flake)"/>
    <circle class="mote m2" cx="41" cy="54" r="1.3" fill="url(#flake)"/>
    <circle class="mote m3" cx="24" cy="54" r="1.2" fill="url(#flake)"/>
    <circle cx="32" cy="32" r="32" fill="url(#vignette)"/>
  </g>

  <circle cx="32" cy="32" r="29" fill="none" stroke="url(#rim)" stroke-width="3.6"/>
  <g class="glint">
    <circle cx="32" cy="32" r="29" fill="none" stroke="#fff" stroke-opacity=".75" stroke-width="1.4" stroke-linecap="round" pathLength="100" stroke-dasharray="7 93" filter="url(#glow)"/>
  </g>
  <circle cx="32" cy="32" r="27.4" fill="none" stroke="#000" stroke-opacity=".35" stroke-width=".8"/>

  <!-- Journal -->
  <g filter="url(#lift)">
    <use href="#coverShape" fill="url(#cover)"/>
    <use href="#pages" fill="url(#page)"/>
  </g>
  <path d="M30 22.6V46.2h4V22.6Z" fill="url(#gutter)"/>
  <g fill="none" stroke="#7a5a2e" stroke-opacity=".55" stroke-width="1.1" stroke-linecap="round">
    <path d="M18 25.6C21.6 24.8 25.4 25 28.8 26.4"/>
    <path d="M18 29.8C21.6 29 25.4 29.2 28.8 30.6"/>
    <path d="M18 34C21.6 33.2 25.4 33.4 28.8 34.8"/>
    <path d="M18 38.2C20.6 37.6 23 37.6 25 38.2"/>
  </g>
  <circle cx="35.8" cy="41.2" r="1.5" fill="#b8383a"/>
  <g class="trail" mask="url(#trailMask)">
    <use href="#trail" fill="none" stroke="#b8383a" stroke-width="1.7" stroke-linecap="round" stroke-dasharray="0.1 1.9"/>
  </g>
  <g mask="url(#bookMask)">
    <rect class="shine" x="0" y="0" width="64" height="64" fill="url(#band)"/>
  </g>

  <!-- Quill, nib on the newest point of the route; the feather breaks the rim. -->
  <g class="quill" filter="url(#lift)">
    <path d="M44.5 31L46.6 27" stroke="#3a2a16" stroke-width="1.4" stroke-linecap="round"/>
    <path d="M46.2 28C47.2 22 50.6 14.6 55.6 9.6C56.6 16 53.8 23.6 46.2 28Z" fill="url(#feather)"/>
    <path d="M46.6 27.4C49 22.4 51.8 16.6 55 10.6" fill="none" stroke="#9a6a2a" stroke-width=".7" stroke-linecap="round"/>
  </g>

  <!-- Recording light. -->
  <g class="rec">
    <circle cx="18.5" cy="14.5" r="4" fill="url(#recGlow)"/>
    <circle cx="18.5" cy="14.5" r="2.1" fill="#ff3b30" stroke="#fff4e0" stroke-width=".8"/>
  </g>
</svg>
